<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Viewport estrictamente configurado para desactivar zoom y soportar Dynamic Island de iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Control de Marcaciones - Ismael Villamagua</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    /* Prevención global de gestos de zoom y selecciones no deseadas */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation; /* Desactiva zoom por doble tap */
      -webkit-tap-highlight-color: transparent;
    }

    body { 
      background-color: var(--bg); 
      color: var(--text); 
      padding: calc(12px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom)) 12px; 
      line-height: 1.4;
      user-select: none; /* Desactiva seleccion de texto accidental */
      -webkit-user-select: none;
    }

    .container { 
      max-width: 480px; /* Tamaño optimizado para la pantalla vertical del iPhone 17 Pro Max */
      margin: 0 auto; 
    }
    
    header { 
      text-align: center; 
      margin-bottom: 20px; 
      padding-bottom: 12px; 
      border-bottom: 1px solid var(--border); 
    }
    header h1 { font-size: 1.5rem; color: #38bdf8; font-weight: 700; }
    header p { color: var(--text-muted); font-size: 0.85rem; }

    .card { 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 14px; 
      padding: 16px; 
      margin-bottom: 16px; 
    }
    
    .card-title { 
      font-size: 1.1rem; 
      font-weight: 600; 
      margin-bottom: 12px; 
      color: #e2e8f0; 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
    }
    .card-title-clickable { cursor: pointer; margin-bottom: 0; }

    .grid-vertical { display: flex; flex-direction: column; gap: 12px; }
    
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
    
    /* 16px font-size para evitar que iOS autohaga zoom al tocar el input */
    select, input { 
      width: 100%; 
      height: 48px;
      padding: 0 12px; 
      background: #0f172a; 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      color: var(--text); 
      font-size: 16px; 
      appearance: none;
      -webkit-appearance: none;
    }
    select:focus, input:focus { outline: 2px solid var(--accent); }

    .checkbox-container { 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      padding: 10px 0;
      cursor: pointer; 
    }
    .checkbox-container input { 
      width: 22px; 
      height: 22px; 
      cursor: pointer; 
      accent-color: var(--accent);
    }
    .checkbox-container span { font-size: 0.95rem; font-weight: 500; }

    .quick-actions { display: flex; gap: 10px; margin-top: 10px; }
    .btn { 
      width: 100%; 
      min-height: 52px; 
      border: none; 
      border-radius: 10px; 
      font-weight: 700; 
      cursor: pointer; 
      font-size: 1.05rem; 
      transition: background 0.2s, transform 0.1s; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active { transform: scale(0.98); }
    .btn-ingreso { background: var(--success); color: white; }
    .btn-salida { background: var(--danger); color: white; }
    .btn-primary { background: var(--accent); color: white; margin-top: 10px; }

    .metrics-grid { display: flex; flex-direction: column; gap: 10px; }
    .metric-card { 
      background: #0f172a; 
      border-radius: 10px; 
      padding: 12px 16px; 
      border-left: 4px solid var(--accent); 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .metric-card.sup { border-left-color: #f59e0b; }
    .metric-card.ext { border-left-color: #ef4444; }
    .metric-card.noc { border-left-color: #a855f7; }
    .metric-card label { margin-bottom: 0; font-size: 0.85rem; }
    .metric-value { font-size: 1.3rem; font-weight: 700; }

    .table-responsive { 
      overflow-x: auto; 
      margin-top: 10px; 
      border-radius: 8px;
      -webkit-overflow-scrolling: touch;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; text-align: left; }
    th, td { padding: 10px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #0f172a; color: var(--text-muted); font-weight: 600; }
    
    .btn-delete { 
      background: #ef444422; 
      color: #ef4444; 
      border: 1px solid #ef4444; 
      padding: 6px 10px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 0.75rem; 
      font-weight: 600;
    }

    .badge { padding: 3px 6px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
    .badge-t1 { background: #38bdf822; color: #38bdf8; }
    .badge-t2 { background: #f59e0b22; color: #f59e0b; }
    .badge-t3 { background: #a855f722; color: #a855f7; }
    .badge-pending { background: #eab30822; color: #eab308; border: 1px solid #eab308; }
    .badge-feriado { background: #ef444422; color: #ef4444; border: 1px solid #ef4444; margin-left: 2px; }

    .period-info { font-size: 0.8rem; color: #38bdf8; display: block; margin-top: 2px; }
    
    .manual-content { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .manual-content.active { display: block; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>REGISTRO DE MARCACIONES</h1>
      <p>Usuario: <strong id="nombreUsuarioVisual">ISMAEL VILLAMAGUA</strong></p>
    </header>

    <!-- MARCACIÓN RÁPIDA Y SELECCIÓN DE TURNO -->
    <div class="card">
      <div class="card-title">Fichaje Rápido Diario</div>
      <div class="grid-vertical">
        <div>
          <label for="turnoActual">Turno Rotativo Asignado</label>
          <select id="turnoActual">
            <option value="1">PRIMER TURNO (00:00 a 07:00)</option>
            <option value="2">SEGUNDO TURNO (07:00 a 15:30)</option>
            <option value="3">TERCER TURNO (15:30 a 00:00)</option>
          </select>
        </div>
        <div>
          <label class="checkbox-container">
            <input type="checkbox" id="esFeriadoRapido">
            <span>¿DÍA FESTIVO?</span>
          </label>
        </div>
      </div>
      <div class="quick-actions" id="contenedorBotonDinamico">
        <!-- Botón único dinámico -->
      </div>
    </div>

    <!-- MARCACIÓN MANUAL (DESPLEGABLE) -->
    <div class="card">
      <div class="card-title card-title-clickable" id="btnToggleManual">
        <span>📝 Marcación Manual</span>
        <span id="iconoDesplegable">▼</span>
      </div>
      <div class="manual-content" id="contenidoManual">
        <form id="formManual">
          <div class="grid-vertical">
            <div>
              <label for="manualTurno">Turno de la Jornada</label>
              <select id="manualTurno">
                <option value="1">1er Turno (00:00 - 07:00)</option>
                <option value="2" selected>2do Turno (07:00 - 15:30)</option>
                <option value="3">3er Turno (15:30 - 00:00)</option>
              </select>
            </div>
            <div>
              <label for="manualIngreso">Fecha y Hora de Ingreso *</label>
              <input type="datetime-local" id="manualIngreso" required>
            </div>
            <div>
              <label for="manualSalida">Fecha y Hora de Salida (Opcional)</label>
              <input type="datetime-local" id="manualSalida">
            </div>
            <div>
              <label class="checkbox-container">
                <input type="checkbox" id="esFeriadoManual">
                <span>¿DÍA FESTIVO?</span>
              </label>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Guardar Registro Manual</button>
        </form>
      </div>
    </div>

    <!-- INFORME DE HORAS Y PERÍODO -->
    <div class="card">
      <div>
        <div class="card-title" style="margin-bottom: 2px;">Informe de Horas Acumuladas</div>
        <span class="period-info" id="rangoTexto">--</span>
      </div>
      
      <div style="margin: 14px 0;">
        <label for="selectMesCobro">Seleccionar Mes de Cobro (Nómina)</label>
        <input type="month" id="selectMesCobro">
      </div>

      <div class="metrics-grid">
        <div class="metric-card sup">
          <label>Horas Suplementarias (50%)</label>
          <div class="metric-value" id="totalSuplementarias">0.0 hrs</div>
        </div>
        <div class="metric-card ext">
          <label>Horas Extraordinarias (100%)</label>
          <div class="metric-value" id="totalExtraordinarias">0.0 hrs</div>
        </div>
        <div class="metric-card noc">
          <label>Recargo Nocturno (25%)</label>
          <div class="metric-value" id="totalNocturnas">0.0 hrs</div>
        </div>
      </div>
    </div>

    <!-- TABLA DE REGISTROS DEL MES -->
    <div class="card">
      <div class="card-title">Historial de Marcaciones</div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Turno</th>
              <th>Ingreso</th>
              <th>Salida</th>
              <th>Sup.</th>
              <th>Ext.</th>
              <th>Noc.</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tablaRegistros">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- FIREBASE CONFIGURATION & LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      query, 
      where, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB568Pir687gLnRXO3nYkBxOFDXtM6zhnU",
      authDomain: "induramamantenimiento.firebaseapp.com",
      projectId: "induramamantenimiento",
      storageBucket: "induramamantenimiento.firebasestorage.app",
      messagingSenderId: "669750736694",
      appId: "1:669750736694:web:13b0774b7175c7f7f06597",
      measurementId: "G-27KZR2Q884"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const usuarioActual = 'ismael';
    let registros = [];
    let turnoPreferidoGuardado = "2";

    const SHIFTS = {
      1: { name: '1er Turno', start: 0, end: 7 },
      2: { name: '2do Turno', start: 7, end: 15.5 },
      3: { name: '3er Turno', start: 15.5, end: 24 }
    };

    // Bloqueo estricto de gestos de zoom en iOS mediante JavaScript
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });

    window.addEventListener('DOMContentLoaded', async () => {
      const hoy = new Date();
      document.getElementById('selectMesCobro').value = hoy.toISOString().slice(0, 7);

      document.getElementById('selectMesCobro').addEventListener('change', renderizarTodo);
      document.getElementById('turnoActual').addEventListener('change', guardarPreferenciaTurno);
      document.getElementById('btnToggleManual').addEventListener('click', toggleManual);
      document.getElementById('formManual').addEventListener('submit', guardarManual);

      await cargarPreferenciaTurno();
      escucharRegistrosFirestore();
    });

    async function cargarPreferenciaTurno() {
      try {
        const prefRef = doc(db, "preferencias", usuarioActual);
        const prefSnap = await getDoc(prefRef);
        if (prefSnap.exists() && prefSnap.data().turnoAsignado) {
          turnoPreferidoGuardado = prefSnap.data().turnoAsignado;
          document.getElementById('turnoActual').value = turnoPreferidoGuardado;
        } else {
          document.getElementById('turnoActual').value = "2";
        }
      } catch (e) {
        console.error("Error al cargar preferencia de turno: ", e);
      }
    }

    async function guardarPreferenciaTurno() {
      const val = document.getElementById('turnoActual').value;
      turnoPreferidoGuardado = val;
      try {
        await setDoc(doc(db, "preferencias", usuarioActual), { turnoAsignado: val }, { merge: true });
      } catch (e) {
        console.error("Error al guardar preferencia de turno: ", e);
      }
    }

    function escucharRegistrosFirestore() {
      const q = query(
        collection(db, "marcaciones"), 
        where("usuario", "==", usuarioActual)
      );

      onSnapshot(q, (snapshot) => {
        registros = snapshot.docs.map(docSnap => ({
          id: docSnap.id,
          ...docSnap.data()
        }));
        renderizarTodo();
      }, (error) => {
        console.error("Error al sincronizar con Firestore: ", error);
      });
    }

    function toggleManual() {
      const content = document.getElementById('contenidoManual');
      const icon = document.getElementById('iconoDesplegable');
      if (content.classList.contains('active')) {
        content.classList.remove('active');
        icon.innerText = '▼';
      } else {
        content.classList.add('active');
        icon.innerText = '▲';
      }
    }

    function obtenerRegistroEnCurso() {
      return registros.find(r => r.ingreso && !r.salida);
    }

    function actualizarBotonAccion() {
      const contenedor = document.getElementById('contenedorBotonDinamico');
      const enCurso = obtenerRegistroEnCurso();
      const turnoSelect = document.getElementById('turnoActual');
      const chkFeriado = document.getElementById('esFeriadoRapido');

      if (enCurso) {
        turnoSelect.value = enCurso.turno;
        turnoSelect.disabled = true;
        chkFeriado.checked = !!enCurso.esFeriado;
        chkFeriado.disabled = true;

        contenedor.innerHTML = `
          <button class="btn btn-salida" id="btnMarcarSalida">
            ⏱ Marcar Salida
          </button>
        `;
        document.getElementById('btnMarcarSalida').onclick = () => marcarRápido('salida');
      } else {
        turnoSelect.disabled = false;
        chkFeriado.disabled = false;
        
        turnoSelect.value = turnoPreferidoGuardado;

        contenedor.innerHTML = `
          <button class="btn btn-ingreso" id="btnMarcarIngreso">⏱️ Marcar Ingreso</button>
        `;
        document.getElementById('btnMarcarIngreso').onclick = () => marcarRápido('ingreso');
      }
    }

    async function marcarRápido(tipo) {
      const ahora = new Date();

      if (tipo === 'ingreso') {
        const turno = document.getElementById('turnoActual').value;
        const esFeriado = document.getElementById('esFeriadoRapido').checked;

        const nuevoIngreso = {
          usuario: usuarioActual,
          turno: turno,
          ingreso: ahora.toISOString(),
          salida: null,
          esFeriado: esFeriado,
          horasSuplementarias: 0,
          horasExtraordinarias: 0,
          horasNocturnas: 0
        };

        try {
          await addDoc(collection(db, "marcaciones"), nuevoIngreso);
        } catch (e) {
          alert("Error al registrar el ingreso en la base de datos.");
          console.error(e);
        }
      } else if (tipo === 'salida') {
        const enCurso = obtenerRegistroEnCurso();
        if (enCurso) {
          const ingresoDate = new Date(enCurso.ingreso);
          const datosCalculados = calcularHorasJornada(ingresoDate, ahora, enCurso.turno, enCurso.esFeriado);
          
          try {
            const docRef = doc(db, "marcaciones", enCurso.id);
            await updateDoc(docRef, {
              salida: ahora.toISOString(),
              horasSuplementarias: datosCalculados.horasSuplementarias,
              horasExtraordinarias: datosCalculados.horasExtraordinarias,
              horasNocturnas: datosCalculados.horasNocturnas
            });
          } catch (e) {
            alert("Error al registrar la salida en la base de datos.");
            console.error(e);
          }
        }
      }
    }

    async function guardarManual(e) {
      e.preventDefault();
      const turno = document.getElementById('manualTurno').value;
      const ingresoVal = document.getElementById('manualIngreso').value;
      const salidaVal = document.getElementById('manualSalida').value;
      const esFeriado = document.getElementById('esFeriadoManual').checked;

      const ingreso = new Date(ingresoVal);
      const enCursoActual = obtenerRegistroEnCurso();

      if (enCursoActual) {
        alert("Ya tienes una jornada en curso abierta. Debes registrar su salida antes de crear otra marcación.");
        return;
      }

      let salida = salidaVal ? new Date(salidaVal) : null;

      if (salida && salida <= ingreso) {
        alert("La fecha/hora de salida debe ser posterior al ingreso.");
        return;
      }

      if (!salida) {
        const hayDiasPosteriores = registros.some(r => new Date(r.ingreso) > ingreso);
        if (hayDiasPosteriores) {
          alert("Debes ingresar obligatoriamente la hora de salida porque ya existen marcaciones registradas en días posteriores.");
          return;
        }
      }

      let datosCalculados = { horasSuplementarias: 0, horasExtraordinarias: 0, horasNocturnas: 0 };
      if (salida) {
        datosCalculados = calcularHorasJornada(ingreso, salida, turno, esFeriado);
      }

      const nuevoRegistro = {
        usuario: usuarioActual,
        turno: turno,
        ingreso: ingreso.toISOString(),
        salida: salida ? salida.toISOString() : null,
        esFeriado: esFeriado,
        ...datosCalculados
      };

      try {
        await addDoc(collection(db, "marcaciones"), nuevoRegistro);
        document.getElementById('formManual').reset();
        toggleManual();
      } catch (e) {
        alert("Error al guardar la marcación manual.");
        console.error(e);
      }
    }

    function calcularHorasJornada(ingreso, salida, turnoId, esFeriado) {
      let supMinutes = 0;
      let extMinutes = 0;
      let nocMinutes = 0;

      let cursor = new Date(ingreso.getTime());
      const end = new Date(salida.getTime());

      let isWeekend = (ingreso.getDay() === 0 || ingreso.getDay() === 6);
      let esJornadaExtraordinaria = isWeekend || esFeriado;

      if (esJornadaExtraordinaria) {
        let totalMinutes = Math.floor((salida - ingreso) / (1000 * 60));
        extMinutes = totalMinutes;
      } else {
        const shiftInfo = SHIFTS[turnoId];
        let shiftEnd = new Date(ingreso.getTime());
        const endHour = Math.floor(shiftInfo.end);
        const endMin = (shiftInfo.end % 1) * 60;
        shiftEnd.setHours(endHour, endMin, 0, 0);
        
        if (turnoId == 3) {
          shiftEnd.setHours(23, 59, 59, 999);
        }

        while (cursor < end) {
          const hour = cursor.getHours();
          if (hour >= 19 || hour < 6) {
            nocMinutes++;
          }
          cursor.setMinutes(cursor.getMinutes() + 1);
        }

        if (salida > shiftEnd) {
          let extraMins = Math.floor((salida - shiftEnd) / (1000 * 60));
          if (extraMins >= 60) {
            supMinutes = extraMins;
          }
        }
      }

      return {
        horasSuplementarias: (supMinutes / 60),
        horasExtraordinarias: (extMinutes / 60),
        horasNocturnas: (nocMinutes / 60)
      };
    }

    function obtenerRangoNomina(mesString) {
      const [year, month] = mesString.split('-').map(Number);
      const inicio = new Date(year, month - 2, 21, 0, 0, 0, 0);
      const fin = new Date(year, month - 1, 20, 23, 59, 59, 999);
      return { inicio, fin };
    }

    function renderizarTodo() {
      actualizarBotonAccion();

      const mesCobroVal = document.getElementById('selectMesCobro').value;
      if (!mesCobroVal) return;

      const { inicio, fin } = obtenerRangoNomina(mesCobroVal);
      const opcionesFecha = { day: '2-digit', month: 'short' };
      document.getElementById('rangoTexto').innerText = 
        `Período: ${inicio.toLocaleDateString('es-EC', opcionesFecha)} - ${fin.toLocaleDateString('es-EC', opcionesFecha)}`;

      let sumSup = 0;
      let sumExt = 0;
      let sumNoc = 0;

      const tbody = document.getElementById('tablaRegistros');
      tbody.innerHTML = '';

      const registrosDelMes = registros.filter(reg => {
        const fechaIng = new Date(reg.ingreso);
        return fechaIng >= inicio && fechaIng <= fin;
      }).sort((a, b) => new Date(b.ingreso) - new Date(a.ingreso));

      if (registrosDelMes.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No hay marcaciones.</td></tr>`;
      } else {
        registrosDelMes.forEach(reg => {
          sumSup += reg.horasSuplementarias || 0;
          sumExt += reg.horasExtraordinarias || 0;
          sumNoc += reg.horasNocturnas || 0;

          const tr = document.createElement('tr');
          const ingDate = new Date(reg.ingreso);
          const salDate = reg.salida ? new Date(reg.salida) : null;

          const ingFormateado = `${ingDate.getDate()}/${ingDate.getMonth()+1} ${ingDate.getHours().toString().padStart(2,'0')}:${ingDate.getMinutes().toString().padStart(2,'0')}`;
          const salFormateado = salDate ? `${salDate.getHours().toString().padStart(2,'0')}:${salDate.getMinutes().toString().padStart(2,'0')}` : `<span class="badge badge-pending">En Curso</span>`;

          const feriadoBadge = reg.esFeriado ? `<span class="badge badge-feriado">F</span>` : '';

          tr.innerHTML = `
            <td><span class="badge badge-t${reg.turno}">T${reg.turno}</span>${feriadoBadge}</td>
            <td>${ingFormateado}</td>
            <td>${salFormateado}</td>
            <td>${(reg.horasSuplementarias || 0).toFixed(1)}h</td>
            <td>${(reg.horasExtraordinarias || 0).toFixed(1)}h</td>
            <td>${(reg.horasNocturnas || 0).toFixed(1)}h</td>
            <td><button class="btn-delete" data-id="${reg.id}">X</button></td>
          `;
          tbody.appendChild(tr);
        });

        document.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idDoc = e.target.getAttribute('data-id');
            eliminarRegistro(idDoc);
          });
        });
      }

      document.getElementById('totalSuplementarias').innerText = `${sumSup.toFixed(1)} h`;
      document.getElementById('totalExtraordinarias').innerText = `${sumExt.toFixed(1)} h`;
      document.getElementById('totalNocturnas').innerText = `${sumNoc.toFixed(1)} h`;
    }

    async function eliminarRegistro(idDoc) {
      if (confirm("¿Eliminar marcación?")) {
        try {
          await deleteDoc(doc(db, "marcaciones", idDoc));
        } catch (e) {
          alert("Error al eliminar la marcación.");
          console.error(e);
        }
      }
    }
  </script>
